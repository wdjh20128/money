<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>記帳王</title>
<meta name="description" content="記帳王：離線可用的個人記帳 App">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="記帳王">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f2f2f7" id="meta-theme">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="stylesheet" href="css/app.css">
<script>
  // Apply theme ASAP to avoid flash
  (function(){try{var t=localStorage.getItem('jzw-theme')||'system';var d=t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';}catch(e){}})();
</script>
</head>
<body>
<div id="statusbar"></div>
<div id="app">
  <main id="views"></main>
  <nav id="tabbar">
    <button class="tab active" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>首頁</span></button>
    <button class="tab" data-tab="reports"><svg viewBox="0 0 24 24"><path d="M12 3v9h9A9 9 0 1 1 12 3zm2-1a8 8 0 0 1 8 8h-8z"/></svg><span>報表</span></button>
    <button class="tab-add" id="btn-add" aria-label="記一筆"><svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg></button>
    <button class="tab" data-tab="accounts"><svg viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h13a1 1 0 0 1 1 1v2h1a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2zm2 0h12v1H5zm11 6.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/></svg><span>帳戶</span></button>
    <button class="tab" data-tab="more"><svg viewBox="0 0 24 24"><path d="M5 10a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm7 0a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm7 0a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/></svg><span>更多</span></button>
  </nav>
  <div id="pages"></div>
  <div id="overlay-root"></div>
  <div id="toast-root"></div>
</div>
<script src="vendor/chart.umd.min.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
</body>
</html>
